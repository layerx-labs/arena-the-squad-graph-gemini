<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquadConnect - World Cup 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-10">
      <h1 class="text-4xl font-extrabold text-blue-600 mb-2">SquadConnect</h1>
      <p class="text-lg text-gray-600">Explore the connections between 2026 World Cup players based on shared club histories.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div class="md:col-span-1 bg-white p-6 rounded-lg shadow border border-gray-200">
        <h2 class="text-2xl font-bold mb-4">Find Teammates</h2>
        <p class="text-sm text-gray-500 mb-6">Select a club and season to see which World Cup 2026 players were on the same roster.</p>
        
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Club</label>
          <select id="club-select" class="w-full p-2 border border-gray-300 rounded-md" disabled>
            <option value="">Loading clubs...</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Season</label>
          <select id="season-select" class="w-full p-2 border border-gray-300 rounded-md" disabled>
            <option value="">Loading seasons...</option>
          </select>
        </div>

        <button id="search-btn" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50" disabled>
          Search
        </button>

        <div class="mt-8 pt-6 border-t border-gray-200">
          <h3 class="text-lg font-semibold mb-2">Dataset Stats</h3>
          <ul id="stats-list" class="text-sm text-gray-600 space-y-1">
            <li>Loading...</li>
          </ul>
        </div>
      </div>

      <div class="md:col-span-2">
        <div class="bg-white p-6 rounded-lg shadow border border-gray-200 min-h-[400px]">
          <h2 class="text-2xl font-bold mb-4">Results</h2>
          <div id="results-container">
            <p class="text-gray-500 italic">Select a club and season to view players.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
